
name: studio-nuxt-build
run-name: studio nuxt build

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - 'master'

  # Déclenchement via le Webhook Prismic (Azure Function)
  repository_dispatch:
    types: [prismic_update]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Add write workflow permissions
permissions:
  contents: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build-and-deploy:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [26]
        pnpm: [12]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - uses: pnpm/setup@v1
        with:
         version: ${{ matrix.pnpm }}
         runtime: node@${{ matrix.node }}
         cache: true
        name: Install pnpm
        id: pnpm-install

      - name: Install  
        run: pnpm install

      - name: Generate
        run: pnpm build
        env:
          NITRO_PRESET: github_pages
          NUXT_CONTENT_PREVIEW_API: https://api.nuxt.studio
          

      # Deployment job
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./.output/public
